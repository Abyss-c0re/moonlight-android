# Moonlight VR keyboard. It starts hidden.
# Show keyboard and Hide keyboard are on the side panel.
# The Hide key releases every held key, then hides the board.
# The next Show places it in front of you again.
# Grip moves it. Grip and the stick resize it.
#
# Trigger types the key under the laser.
# Stick click on the typing hand holds Shift for that key. The laser turns orange.
# Stick click on the other hand applies alt_modifier. The laser turns purple when that is not none.
# Shift, Ctrl, Alt, and Super stay down until the next normal key is released,
# the same modifier is pressed again, or the keyboard hides.
#
# B or Y still toggles passthrough. The controller menu button still opens this side panel.
#
# Copy this file to the app private files directory to replace the packaged layout.
# Debug install: /data/data/com.limelight.debug/files/vr_keyboard.cfg
# Show keyboard reads the file again. The file must be under 48000 bytes.
#
# row width:Name width:Name ...
# A bare name is one unit wide. ~ is an empty gap.
# macro NAME Key+ Key Key-
# Key+ stays down, Key- comes up, and a bare key is a tap.
# COPY, PASTE, and KILL ignore latched modifiers.
# label Name unshifted shifted
# label Space with no text leaves the space bar blank.
# alt_modifier is none, shift, ctrl, alt, meta, or super.
# meta is AltGr. super is the Windows key.
# exec lines are ignored.
# A # starts a comment only when it is the first character on the line.
# Caps is a key name. XF86Favorites is the browser-favorites key, where WayVR puts Menu.
# Print is the print-screen key.

alt_modifier none

row 1.5:Escape 0.5:~ 1:F1 1:F2 1:F3 1:F4 0.5:~ 1:F5 1:F6 1:F7 1:F8 0.5:~ 1:F9 1:F10 1:F11 1:F12 0.5:~ 1:Print 1:Scroll 1:Pause 0.5:~ 1:COPY 1:PASTE 1:~ 1:KILL
row 1:Oem3 1:N1 1:N2 1:N3 1:N4 1:N5 1:N6 1:N7 1:N8 1:N9 1:N0 1:Minus 1:Plus 2:BackSpace 0.5:~ 1:Insert 1:Home 1:Prior 0.5:~ 1:NumLock 1:KP_Divide 1:KP_Multiply 1:KP_Subtract
row 1.5:Tab 1:Q 1:W 1:E 1:R 1:T 1:Y 1:U 1:I 1:O 1:P 1:Oem4 1:Oem6 1.5:Oem5 0.5:~ 1:Delete 1:End 1:Next 0.5:~ 1:KP_7 1:KP_8 1:KP_9 1:KP_Add
row 1.75:XF86Favorites 1:A 1:S 1:D 1:F 1:G 1:H 1:J 1:K 1:L 1:Oem1 1:Oem7 2.25:Return 4:~ 1:KP_4 1:KP_5 1:KP_6 1:~
row 1.25:LShift 1:Oem102 1:Z 1:X 1:C 1:V 1:B 1:N 1:M 1:Comma 1:Period 1:Oem2 2.75:RShift 1.5:~ 1:Up 1.5:~ 1:KP_1 1:KP_2 1:KP_3 1:KP_Enter
row 1.25:LCtrl 1.25:LSuper 1.25:LAlt 6.25:Space 1.25:Meta 1.25:RSuper 1.25:Menu 1.25:RCtrl 0.5:~ 1:Left 1:Down 1:Right 0.5:~ 2:KP_0 1:KP_Decimal 1:~
row 16:~ 7:HIDE

macro COPY LCtrl+ C LCtrl-
macro PASTE LCtrl+ V LCtrl-
macro KILL LSuper+ LCtrl+ Escape LCtrl- LSuper-

label Escape Esc
label Prior PgUp
label Next PgDn
label NumLock Num
label Space
label LAlt Alt
label LCtrl Ctrl
label RCtrl Ctrl
label LSuper Super
label RSuper Super
label LShift Shift
label RShift Shift
label Insert Ins
label Delete Del
label BackSpace <<
label KP_Divide /
label KP_Add +
label KP_Multiply *
label KP_Decimal .
label KP_Subtract -
label KP_Enter Ent
label Print Prn
label Scroll Scr
label Pause Brk
label XF86Favorites Menu
label HIDE Hide
label Up ^
label Down v
label Left <
label Right >
label N1 1 !
label N2 2 @
label N3 3 #
label N4 4 $
label N5 5 %
label N6 6 ^
label N7 7 &
label N8 8 *
label N9 9 (
label N0 0 )
label Minus - _
label Plus = +
label Comma , <
label Period . >
label Oem1 ; :
label Oem2 / ?
label Oem3 ` ~
label Oem4 [ {
label Oem5 \ |
label Oem6 ] }
label Oem7 ' "
label Oem102 \ |
